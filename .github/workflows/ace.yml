# GEB-ACE-001 — correctness + charged bench
name: ace

on:
  push:
    branches: [main, geb-ace-001]
  pull_request:
    branches: [main]

jobs:
  correctness:
    name: Phase A correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + run correctness
        run: |
          g++ -O2 -std=c++20 -I public/geblomi-sort tests/correctness.cpp -o correctness
          ./correctness

  bench:
    name: Phase B charged bench
    runs-on: ubuntu-latest
    needs: correctness
    steps:
      - uses: actions/checkout@v4
      - name: Build + run charged bench
        run: |
          g++ -O2 -std=c++20 -I public/geblomi-sort tests/bench.cpp -o bench
          ./bench | tee bench_out.txt
      - name: Publish table to step summary
        run: |
          echo '## Charged bench (N=1e6, best-of-3)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bench_out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: charged-bench
          path: bench_out.txt
